services:
  dicom_app:
    build: .
    volumes:
      # Note: do NOT bind-mount the whole repo over /app - it would hide the
      # .venv installed during the image build. Mount the X11 socket only.
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - DISPLAY=${DISPLAY}
      - DICOM_PACS_HOST=${DICOM_PACS_HOST:-localhost}
      - DICOM_PACS_PORT=${DICOM_PACS_PORT:-4242}
      - DICOM_PACS_AE_TITLE=${DICOM_PACS_AE_TITLE:-ORTHANC}
      - DICOM_CALLING_AE_TITLE=${DICOM_CALLING_AE_TITLE:-MYAETITLE}
      - DICOM_STORE_SCP_PORT=${DICOM_STORE_SCP_PORT:-11115}
      - DICOM_DB_NAME=${DICOM_DB_NAME:-dicom_db}
      - DICOM_DB_USER=${DICOM_DB_USER:-dicom_user}
      - DICOM_DB_PASSWORD=${DICOM_DB_PASSWORD:?set DICOM_DB_PASSWORD in .env}
      - DICOM_DB_HOST=${DICOM_DB_HOST:-localhost}
      - DICOM_DB_PORT=${DICOM_DB_PORT:-5432}
      - ORTHANC_HTTP_URL=${ORTHANC_HTTP_URL:-http://localhost:8042}
      - ORTHANC_HTTP_USERNAME=${ORTHANC_HTTP_USERNAME:-orthanc}
      - ORTHANC_HTTP_PASSWORD=${ORTHANC_HTTP_PASSWORD:?set ORTHANC_HTTP_PASSWORD in .env}
    # network_mode: host is what lets DICOM_PACS_HOST/ORTHANC_HTTP_URL/
    # DICOM_DB_HOST all use "localhost" to reach the other services' ports
    # published below - it also means this container is NOT on the compose
    # bridge network, so service names like "db"/"orthanc" do not resolve
    # here (they do resolve for db/orthanc talking to each other below).
    network_mode: host
    depends_on:
      - db
      - orthanc

  db:
    image: postgres:13
    ports:
      # dicom_app runs with network_mode: host (see below), so it is not on
      # this compose network and can't resolve "db" by name - it reaches
      # this service the same way it reaches orthanc: via localhost and a
      # published port. Bound to 127.0.0.1 only, not exposed externally.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DICOM_DB_NAME:-dicom_db}
      POSTGRES_USER: ${DICOM_DB_USER:-dicom_user}
      POSTGRES_PASSWORD: ${DICOM_DB_PASSWORD:?set DICOM_DB_PASSWORD in .env}
      # consumed by docker/postgres-init/init-orthanc-db.sh to create a
      # second, separate database for orthanc below
      ORTHANC_DB_USER: ${ORTHANC_DB_USER:-orthanc_user}
      ORTHANC_DB_PASSWORD: ${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD in .env}
      ORTHANC_DB_NAME: ${ORTHANC_DB_NAME:-orthanc_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  # jodogne/orthanc-plugins is unmaintained and has no mechanism to read
  # ORTHANC__* env vars at all - it just runs Orthanc against a static
  # config file baked into the image. orthancteam/orthanc is the actively
  # maintained image and is what implements that env-var convention.
  orthanc:
    image: orthancteam/orthanc:latest
    ports:
      - "4242:4242"  # DICOM
      - "8042:8042"  # HTTP
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      # registers dicom_app as a known DICOM modality so C-MOVE (Receive
      # from PACS) can push instances back to it - see the file for details
      - ./docker/orthanc-config/modalities.json:/etc/orthanc/modalities.json:ro
    extra_hosts:
      # lets this container reach dicom_app's Storage SCP, which runs on
      # the Docker host's own network (network_mode: host on dicom_app)
      - "host.docker.internal:host-gateway"
    environment:
      ORTHANC__NAME: "Orthanc"
      ORTHANC__DICOM_AET: ${DICOM_PACS_AE_TITLE:-ORTHANC}
      ORTHANC__DICOM_SERVER_ENABLED: "true"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      # creates the 'orthanc' HTTP user with this password (see ORTHANC_HTTP_USERNAME/_PASSWORD in config.py)
      ORTHANC_PASSWORD: ${ORTHANC_HTTP_PASSWORD:?set ORTHANC_HTTP_PASSWORD in .env}
      # its own PostgreSQL index+storage - a separate database from the app's, created by
      # docker/postgres-init/init-orthanc-db.sh on the db service above
      ORTHANC__POSTGRESQL__ENABLE_INDEX: "true"
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: "true"
      ORTHANC__POSTGRESQL__HOST: "db"
      ORTHANC__POSTGRESQL__DATABASE: ${ORTHANC_DB_NAME:-orthanc_db}
      ORTHANC__POSTGRESQL__USERNAME: ${ORTHANC_DB_USER:-orthanc_user}
      ORTHANC__POSTGRESQL__PASSWORD: ${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD in .env}
      # substituted into docker/orthanc-config/modalities.json - must match
      # config.py's PACS_CONFIG on the app side
      DICOM_CALLING_AE_TITLE: ${DICOM_CALLING_AE_TITLE:-MYAETITLE}
      DICOM_STORE_SCP_PORT: ${DICOM_STORE_SCP_PORT:-11115}
    depends_on:
      - db

volumes:
  postgres_data:
  orthanc_data: